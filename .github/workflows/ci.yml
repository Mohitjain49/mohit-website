name: Vue.js CI

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.3.0'

      - name: Install Dependencies
        run: npm ci

      - name: Building...
        run: npm run build

      - name: Deploy Bundles To GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: bundle-visualizer
          clean: true
          clean-exclude: |
            README.md