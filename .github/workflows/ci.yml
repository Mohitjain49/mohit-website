name: Vue.js CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - run: npm install

      - name: Testing...
        run: npm run test

      - run: npm ci
      - name: Building...
        run: npm run build