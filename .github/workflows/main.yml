name: Build and Deploy Mohit's Website to AWS CloudFront

on:
  push:
    branches:
      - main # Set this to your deployment branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Set this to your Node.js version

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm run test

      - name: Build
        env:
          VITE_GOOGLE_CLOUD_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLOUD_CLIENT_ID }}
          VITE_GOOGLE_CLOUD_API_KEY: ${{ secrets.VITE_GOOGLE_CLOUD_API_KEY }}
          VITE_GOOGLE_CLOUD_APP_ID: ${{ secrets.VITE_GOOGLE_CLOUD_APP_ID }}
        run: npm run build

      - name: Deploy to AWS S3 and CloudFront with custom script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_WEBSITE_ID }}
          AWS_BUCKET: ${{ 'mohit-website' }}
          AWS_REGION: ${{ 'us-east-1' }}
          BUILD_OUTPUT: ${{ 'dist' }}
        run: npm run deploy

